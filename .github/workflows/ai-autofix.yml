name: AI PR Pipeline (Review + Auto-Fix, Claude Code / Max plan)

# Same two-mode, four-agent pipeline as v3, but ALL agents run on
# Claude Code authenticated with a Pro/Max subscription OAuth token —
# no DeepSeek, no Aider, no pay-per-token API billing.
#
# ONE-TIME SETUP
#   1. Locally run:  claude setup-token
#   2. Save the printed token as repo secret:  CLAUDE_CODE_OAUTH_TOKEN
#   3. Do NOT define ANTHROPIC_API_KEY anywhere in this repo's secrets or
#      env — it takes precedence over the OAuth token and would switch
#      billing to an API account instead of your subscription.
#   4. Create the "auto-fix" label.
#
# NOTES
#   - Usage draws from YOUR Max plan quota (shared with your own Claude /
#     Claude Code sessions). Fine for personal repos and low PR volume;
#     for org-wide scale Anthropic recommends API keys or Team seats,
#     since Max subscriptions are intended for a single user.
#   - The OAuth token can be invalidated if you log out of Claude Code;
#     regenerate with `claude setup-token` and update the secret.
#
# AGENTS (per cycle, capped at MAX_ITERS)
#   AGENT 1 REVIEWER   claude -p, read-only, strict JSON issue list
#   AGENT 2 VALIDATOR  claude -p, read-only, discards invalid issues
#   AGENT 3 FIXER      claude -p agentic with Edit/Write tools (auto-commit
#                      added, since Claude Code does not commit like Aider)
#   AGENT 4 VERIFIER   claude -p, read-only, confirms fixes + re-reviews;
#                      open items loop back to AGENT 2
#
# Kept from v3: tsc baseline (pre-existing errors outside the PR's files
# excluded from the gate), prisma generate, discarded-issue memory,
# anti-suppression rules, scope guard covering uncommitted changes,
# fixed/open tables in the sub-PR description, per-cycle audit comment.
#
# TO RE-RUN fix mode: remove the "auto-fix" label, add it again.

on:
  pull_request:
    types: [opened, reopened, ready_for_review, labeled]

concurrency:
  group: ai-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  pipeline:
    if: >-
      ${{ (github.event.action == 'labeled' && github.event.label.name == 'auto-fix') ||
          (github.event.action != 'labeled' && github.event.sender.type != 'Bot') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # HARD CAP #1

    env:
      MODE: ${{ github.event.action == 'labeled' && 'fix' || 'review' }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_ITERS: "3" # HARD CAP #2
      CLAUDE_MODEL: "sonnet" # alias; use "opus" for harder repos (burns quota faster)
      TEAM_LEAD: "PATELMIHIR2715" # <-- CHANGE

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # Node + Claude Code CLI are needed in BOTH modes
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # <-- CHANGE if needed
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # ---- fix mode only: project toolchain ----
      - name: Install dependencies
        if: ${{ env.MODE == 'fix' }}
        run: npm ci # <-- CHANGE to pnpm/yarn if needed
      - name: Generate Prisma client (needed for tsc if repo uses Prisma)
        if: ${{ env.MODE == 'fix' }}
        run: npx prisma generate || echo "No Prisma schema - skipping"

      - name: Create fix branch
        if: ${{ env.MODE == 'fix' }}
        run: |
          git config user.name "ai-autofix[bot]"
          git config user.email "ai-autofix@users.noreply.github.com"
          FIX_BRANCH="autofix/pr-${{ github.event.pull_request.number }}"
          git checkout -B "$FIX_BRANCH"
          echo "FIX_BRANCH=$FIX_BRANCH" >> "$GITHUB_ENV"
          echo "FEATURE_BRANCH=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Agent pipeline
        run: |
          set -e
          PR_NUM="${{ github.event.pull_request.number }}"
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No JS/TS files changed. Nothing to do."
            echo "AUTOFIX_STATUS=skipped" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "Mode: $MODE"; echo "Files in scope:"; echo "$CHANGED"
          mkdir -p /tmp/agents
          printf '%s\n' $CHANGED > /tmp/agents/changed.txt

          # ---------------- helpers ----------------
          bundle() {
            : > /tmp/agents/code.txt
            for f in $CHANGED; do
              { echo "===== FILE: $f ====="; cat "$f"; echo; } >> /tmp/agents/code.txt
            done
            head -c 80000 /tmp/agents/code.txt > /tmp/agents/code.tmp
            mv /tmp/agents/code.tmp /tmp/agents/code.txt
          }

          # Read-only agent call on the Max-plan OAuth token: instructions +
          # data are piped in, Claude replies with plain text (expected: JSON).
          call_agent() { # $1=instructions-file $2=data-file $3=output-file
            cat "$1" "$2" | claude -p "Follow the instructions above exactly. Respond with ONLY the required JSON - no prose, no markdown fences." \
              --model "$CLAUDE_MODEL" --max-turns 1 --output-format text \
              > "$3" 2>/dev/null || true
          }

          clean_json() { # $1=raw $2=out $3=fallback
            sed -n '/[{[]/,$p' "$1" | tac | sed -n '/[]}]/,$p' | tac > "$2" || true
            jq -e . "$2" >/dev/null 2>&1 || printf '%s' "$3" > "$2"
          }

          checks() { # tsc with baseline; pre-existing errors outside PR files excluded
            npx tsc --noEmit > /tmp/agents/tsc.raw 2>&1 || true
            grep -E 'error TS' /tmp/agents/tsc.raw | sort -u > /tmp/agents/tsc.sorted || true
            comm -13 /tmp/agents/tsc.baseline /tmp/agents/tsc.sorted > /tmp/agents/tsc.log || true
            TSC_OK=1; [ -s /tmp/agents/tsc.log ] && TSC_OK=0
            LINT_OK=1
            if ls eslint.config.* .eslintrc* >/dev/null 2>&1; then
              LINT_OK=0
              npx eslint $CHANGED > /tmp/agents/eslint.log 2>&1 && LINT_OK=1 || true
            else
              echo "(no ESLint config in repo - lint skipped)" > /tmp/agents/eslint.log
            fi
          }

          validate() {
            if [ "$(jq '[.issues[]?] | length' /tmp/agents/issues.json)" = "0" ]; then
              echo '{"valid_issues":[],"discarded":[]}' > /tmp/agents/valid.json
              return
            fi
            { echo "CODE:"; cat /tmp/agents/code.txt; echo
              echo "RAISED ISSUES:"; cat /tmp/agents/issues.json; } > /tmp/agents/usr.txt
            call_agent /tmp/agents/validator.sys /tmp/agents/usr.txt /tmp/agents/raw.txt
            clean_json /tmp/agents/raw.txt /tmp/agents/valid.json '{"valid_issues":[],"discarded":[]}'
          }

          md_table() {
            echo "| Severity | Category | File | Problem | Fix |"
            echo "|---|---|---|---|---|"
            jq -r '.[] | "| \(.severity) | \(.category) | \(.file | gsub("\\|";"/")) | \(.problem | gsub("\\|";"/")) | \(.suggested_fix // "-" | gsub("\\|";"/")) |"' "$1"
          }

          # ---------------- agent instructions ----------------
          cat > /tmp/agents/reviewer.sys <<'EOF'
          You are AGENT 1 - REVIEWER: a strict senior application-security engineer. The code is largely AI-generated, so hunt hard for:
          SECURITY: hardcoded secrets/API keys/passwords; logging of secrets, OTPs, tokens or PII; SQL/command injection; path traversal; SSRF; insecure randomness for tokens/OTPs; missing input validation; unsafe eval/exec.
          BUGS: missing await on async calls; unhandled promise rejections; null/undefined access; loose equality (==); infinite loops and off-by-one errors; division by zero and unhandled edge cases; 'any' types including 'as any' casts; error suppression comments (@ts-ignore, @ts-expect-error, ts-nocheck, eslint-disable) hiding real problems.
          OPTIMIZATIONS: repeated/unnecessary work, avoidable O(n^2) patterns, blocking synchronous calls on hot paths. Only flag optimizations with a real, measurable benefit.
          Required output:
          {"issues":[{"id":1,"file":"path","category":"security|bug|optimization","severity":"critical|high|medium|low","problem":"...","suggested_fix":"..."}]}
          Use {"issues":[]} if the code is clean.
          EOF

          cat > /tmp/agents/validator.sys <<'EOF'
          You are AGENT 2 - VALIDATOR. You receive source code and a list of raised issues. Independently verify EVERY issue against the actual code. Discard: false positives, duplicates, pure style nitpicks, and optimizations with no real benefit or that risk changing behaviour. Keep everything genuine - never discard a real security issue.
          Required output:
          {"valid_issues":[<the input issue objects that are genuine>],"discarded":[{"id":1,"reason":"..."}]}
          EOF

          cat > /tmp/agents/verifier.sys <<'EOF'
          You are AGENT 4 - VERIFIER. You receive the FIXED source code, the list of issues that were supposed to be fixed, and a list of issues previously DISCARDED as invalid.
          1) For each issue that was supposed to be fixed, check the code and decide if it is genuinely resolved.
          2) Re-review the code from scratch to the same security/bug/optimization standard, including problems introduced by the fixes themselves. Flag any error-suppression comments (@ts-ignore, @ts-expect-error, ts-nocheck, eslint-disable) added by the fixes.
          3) Do NOT re-raise any issue (or an equivalent of it) that appears in the PREVIOUSLY DISCARDED list.
          Required output:
          {"unresolved":[<issue objects still present>],"new_issues":[{"id":101,"file":"...","category":"security|bug|optimization","severity":"critical|high|medium|low","problem":"...","suggested_fix":"..."}]}
          Use empty arrays when everything is resolved and nothing new was found.
          EOF

          # ---------------- PHASE 1: REVIEWER ----------------
          bundle
          { echo "Review these changed files:"; echo; cat /tmp/agents/code.txt; } > /tmp/agents/usr.txt
          call_agent /tmp/agents/reviewer.sys /tmp/agents/usr.txt /tmp/agents/raw.txt
          if [ ! -s /tmp/agents/raw.txt ]; then
            echo "Reviewer returned nothing. Check CLAUDE_CODE_OAUTH_TOKEN (regenerate with 'claude setup-token' if you logged out) and plan usage limits."
            exit 1
          fi
          clean_json /tmp/agents/raw.txt /tmp/agents/issues.json '{"issues":[]}'
          N_ISSUES=$(jq '[.issues[]?] | length' /tmp/agents/issues.json)
          echo "AGENT 1 (Reviewer) raised $N_ISSUES issue(s)."

          # ================ REVIEW MODE ================
          if [ "$MODE" = "review" ]; then
            validate
            jq '[.valid_issues[]?]' /tmp/agents/valid.json > /tmp/agents/show.json
            N_VALID=$(jq 'length' /tmp/agents/show.json)
            N_DISC=$(jq '[.discarded[]?] | length' /tmp/agents/valid.json)
            {
              echo "## 🤖 AI review (Claude) — $N_VALID validated issue(s) ($N_DISC raised-then-discarded as invalid)"
              echo
              if [ "$N_VALID" = "0" ]; then
                echo "No valid security issues, bugs, or worthwhile optimizations found in the changed JS/TS files. ✅"
              else
                md_table /tmp/agents/show.json
                echo
                echo "> **Add the \`auto-fix\` label** to this PR and the pipeline will fix these automatically in a sub-PR."
              fi
            } > /tmp/agents/review.md
            gh pr comment "$PR_NUM" --body-file /tmp/agents/review.md
            echo "AUTOFIX_STATUS=review-only" >> "$GITHUB_ENV"
            exit 0
          fi

          # ================ FIX MODE ================
          npx tsc --noEmit > /tmp/agents/tsc.base 2>&1 || true
          grep -E 'error TS' /tmp/agents/tsc.base | grep -vFf /tmp/agents/changed.txt | sort -u > /tmp/agents/tsc.baseline || true
          if [ -s /tmp/agents/tsc.baseline ]; then
            echo "NOTE: $(wc -l < /tmp/agents/tsc.baseline) pre-existing tsc error(s) outside the PR's files - excluded from the gate."
          fi

          AUDIT=/tmp/agents/audit.md
          echo "## AI multi-agent audit for PR #$PR_NUM (Claude Code)" > "$AUDIT"
          { echo; echo "**Agent 1 (Reviewer)** raised **$N_ISSUES** issue(s)."
            if [ -s /tmp/agents/tsc.baseline ]; then
              echo; echo "_Note: $(wc -l < /tmp/agents/tsc.baseline) pre-existing tsc error(s) outside this PR's files were excluded from the pass/fail gate._"
            fi; } >> "$AUDIT"
          echo '[]' > /tmp/agents/fixed.json
          echo '[]' > /tmp/agents/discarded_all.json
          STATUS="needs-human-review"

          for i in $(seq 1 "$MAX_ITERS"); do
            echo "========== CYCLE $i of $MAX_ITERS =========="
            printf '\n### Cycle %s\n' "$i" >> "$AUDIT"

            # -------- PHASE 2: VALIDATOR --------
            validate
            N_VALID=$(jq '[.valid_issues[]?] | length' /tmp/agents/valid.json)
            N_DISC=$(jq '[.discarded[]?] | length' /tmp/agents/valid.json)
            echo "AGENT 2 (Validator): $N_VALID valid, $N_DISC discarded."
            { echo "- Agent 2 (Validator): **$N_VALID valid**, **$N_DISC discarded**"
              jq -r '.discarded[]? | "  - discarded #\(.id): \(.reason)"' /tmp/agents/valid.json; } >> "$AUDIT"

            jq -s '[.[1].discarded[]? as $d | (.[0].issues[]? | select(.id == $d.id) | {id, file, problem, reason: $d.reason})]' \
              /tmp/agents/issues.json /tmp/agents/valid.json > /tmp/agents/cycle_disc.json
            jq -s '.[0] + .[1]' /tmp/agents/discarded_all.json /tmp/agents/cycle_disc.json > /tmp/agents/disc.tmp
            mv /tmp/agents/disc.tmp /tmp/agents/discarded_all.json

            checks
            if [ "$N_VALID" = "0" ] && [ "$TSC_OK" = "1" ] && [ "$LINT_OK" = "1" ]; then
              STATUS="clean"; echo "No valid issues left; no NEW tsc/eslint errors. Done."; break
            fi

            # -------- PHASE 3: FIXER (Claude Code, agentic) --------
            {
              echo "Fix ALL of the following validated issues in this repository. Keep changes minimal and behaviour-preserving."
              echo "HARD RULES: you may ONLY modify these files (no other file, no new files, no renames, no config files):"
              printf '  %s\n' $CHANGED
              echo "NEVER suppress errors with @ts-ignore, @ts-expect-error, ts-nocheck, or eslint-disable. If an error comes from the repository environment (e.g. missing generated code) rather than these files, leave it alone."
              echo
              echo "ISSUES TO FIX:"
              jq -r '.valid_issues[]? | "- [\(.severity)/\(.category)] \(.file): \(.problem) -> \(.suggested_fix)"' /tmp/agents/valid.json
              echo; echo "--- NEW TypeScript errors (pre-existing repo errors already excluded) ---"; tail -c 4000 /tmp/agents/tsc.log
              echo; echo "--- ESLint errors ---"; tail -c 4000 /tmp/agents/eslint.log
            } > /tmp/agents/fix-prompt.txt
            claude -p "$(cat /tmp/agents/fix-prompt.txt)" \
              --model "$CLAUDE_MODEL" \
              --permission-mode acceptEdits \
              --allowedTools "Read,Edit,Write,Grep,Glob" \
              --max-turns 20 \
              > /tmp/agents/fixer.log 2>&1 || true
            tail -20 /tmp/agents/fixer.log
            # Claude Code does not auto-commit (Aider did) - commit explicitly
            git add -A
            git commit -m "fix(autofix): cycle $i automated fixes" || echo "Cycle $i: no changes to commit."

            # -------- PHASE 4: VERIFIER --------
            bundle
            checks
            { echo "FIXED CODE:"; cat /tmp/agents/code.txt; echo
              echo "ISSUES THAT WERE SUPPOSED TO BE FIXED:"
              jq '{issues:[.valid_issues[]?]}' /tmp/agents/valid.json; echo
              echo "PREVIOUSLY DISCARDED AS INVALID (do NOT re-raise these or equivalents):"
              cat /tmp/agents/discarded_all.json; } > /tmp/agents/usr.txt
            call_agent /tmp/agents/verifier.sys /tmp/agents/usr.txt /tmp/agents/raw.txt
            clean_json /tmp/agents/raw.txt /tmp/agents/verify.json '{"unresolved":[],"new_issues":[]}'
            N_UNRES=$(jq '[.unresolved[]?] | length' /tmp/agents/verify.json)
            N_NEW=$(jq '[.new_issues[]?] | length' /tmp/agents/verify.json)
            echo "AGENT 4 (Verifier): $N_UNRES unresolved, $N_NEW new."
            echo "- Agent 4 (Verifier): **$N_UNRES unresolved**, **$N_NEW new**, tsc=$TSC_OK lint=$LINT_OK" >> "$AUDIT"

            UNRES_IDS=$(jq -c '[.unresolved[]?.id]' /tmp/agents/verify.json)
            jq --argjson un "$UNRES_IDS" \
              '[.valid_issues[]? | select((.id | IN($un[])) | not)]' \
              /tmp/agents/valid.json > /tmp/agents/cycle_fixed.json
            jq -s '.[0] + .[1]' /tmp/agents/fixed.json /tmp/agents/cycle_fixed.json > /tmp/agents/fixed.tmp
            mv /tmp/agents/fixed.tmp /tmp/agents/fixed.json

            if [ "$N_UNRES" = "0" ] && [ "$N_NEW" = "0" ] && [ "$TSC_OK" = "1" ] && [ "$LINT_OK" = "1" ]; then
              STATUS="clean"; echo "All validated issues verified fixed. Done."; break
            fi

            jq '{issues: ([.unresolved[]?] + [.new_issues[]?])}' /tmp/agents/verify.json > /tmp/agents/issues.json
          done

          # -------- sub-PR description: fixed / still open --------
          jq '.issues // []' /tmp/agents/issues.json > /tmp/agents/open.json 2>/dev/null || echo '[]' > /tmp/agents/open.json
          [ "$STATUS" = "clean" ] && echo '[]' > /tmp/agents/open.json
          N_FIXED=$(jq 'length' /tmp/agents/fixed.json)
          N_OPEN=$(jq 'length' /tmp/agents/open.json)
          {
            echo "## 🤖 Multi-agent auto-fix for #$PR_NUM (Claude Code)"
            echo
            echo "Source PR: ${{ github.event.pull_request.html_url }} — pipeline status: **$STATUS**"
            echo
            echo "### ✅ Issues fixed ($N_FIXED)"
            if [ "$N_FIXED" = "0" ]; then echo "_None_"; else md_table /tmp/agents/fixed.json; fi
            echo
            if [ "$N_OPEN" != "0" ]; then
              echo "### ⚠️ Still open — needs human review ($N_OPEN)"
              md_table /tmp/agents/open.json
              echo
            fi
            echo "_Optimizations appear above under category \`optimization\`. The per-cycle agent audit is posted as a comment. Review alongside the original PR before merging into \`$FEATURE_BRANCH\`._"
          } | head -c 60000 > /tmp/agents/summary.md

          {
            echo
            if [ "$STATUS" = "clean" ]; then
              echo "**FINAL STATUS: CLEAN** - every validated issue fixed and verified; no new tsc/eslint errors."
            else
              echo "**FINAL STATUS: NEEDS HUMAN REVIEW** - MAX_ITERS reached with issues still open (see PR description)."
            fi
          } >> "$AUDIT"
          echo "AUTOFIX_STATUS=$STATUS" >> "$GITHUB_ENV"

          # -------- scope guard: committed AND uncommitted changes --------
          git add -A
          { git diff --name-only "$BASE_SHA" HEAD || true
            git diff --cached --name-only || true
          } | sort -u > /tmp/agents/touched.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            printf '%s\n' "$CHANGED" | grep -qxF "$f" && continue
            echo "Reverting out-of-scope change: $f"
            if git cat-file -e "$BASE_SHA:$f" 2>/dev/null; then
              git checkout "$BASE_SHA" -- "$f"
            else
              git rm -qf --ignore-unmatch -- "$f" || rm -f -- "$f"
            fi
          done < /tmp/agents/touched.txt
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore(autofix): revert out-of-scope changes"
          fi

      - name: Open or update sub-PR with fixed/open issue report
        if: ${{ env.MODE == 'fix' }}
        run: |
          if [ "${AUTOFIX_STATUS:-skipped}" = "skipped" ]; then exit 0; fi
          if git diff --quiet "$BASE_SHA" HEAD; then
            echo "No fixes were made. Not opening a PR."
            exit 0
          fi
          git push --force origin "$FIX_BRANCH"
          NUM=$(gh pr list --head "$FIX_BRANCH" --base "$FEATURE_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh pr edit "$NUM" --body-file /tmp/agents/summary.md
            echo "Sub-PR #$NUM updated."
          else
            gh pr create \
              --base "$FEATURE_BRANCH" \
              --head "$FIX_BRANCH" \
              --title "AI auto-fix for PR #${{ github.event.pull_request.number }} [${AUTOFIX_STATUS}]" \
              --body-file /tmp/agents/summary.md \
              --reviewer "$TEAM_LEAD"
          fi

      - name: Post per-cycle audit comment on sub-PR
        if: ${{ env.MODE == 'fix' }}
        run: |
          [ -f /tmp/agents/audit.md ] || exit 0
          if git diff --quiet "$BASE_SHA" HEAD; then
            TARGET="${{ github.event.pull_request.number }}"
          else
            TARGET=$(gh pr list --head "$FIX_BRANCH" --state open --json number --jq '.[0].number // empty')
            [ -n "$TARGET" ] || TARGET="${{ github.event.pull_request.number }}"
          fi
          gh pr comment "$TARGET" --body-file /tmp/agents/audit.md
