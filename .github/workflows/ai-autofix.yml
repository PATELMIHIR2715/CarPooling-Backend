name: AI Auto-Fix (DeepSeek + Aider)

# HOW IT WORKS
# ------------
# Runs ONLY when you add the label "auto-fix" to a pull request.
# It fixes issues on a NEW branch (autofix/pr-<N>) and opens a SUB-PR
# targeting the original PR's feature branch, so:
#   - the original PR is never touched directly
#   - the team lead can compare the original PR and the fix PR side by side
#   - it cannot self-retrigger (fixes go to a different branch; the sub-PR
#     does not carry the "auto-fix" label)
#
# BEFORE USING, change the 3 values marked  <-- CHANGE  below,
# and create a label named exactly "auto-fix" (Issues -> Labels -> New label).

on:
  pull_request:
    types: [labeled]

concurrency:
  group: autofix-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-fix:
    if: ${{ github.event.label.name == 'auto-fix' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30 # HARD CAP #1: kills a stuck run

    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MAX_ITERS: "3" # HARD CAP #2: max fix passes
      MODEL: "deepseek/deepseek-v4-flash"
      TEAM_LEAD: "PATELMIHIR2715" # <-- CHANGE

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20" # <-- CHANGE if your project uses another version
      - name: Install dependencies
        run: npm ci # <-- CHANGE to pnpm/yarn install if needed

      - name: Setup Python + Aider
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Aider
        run: python -m pip install aider-chat

      - name: Create fix branch
        run: |
          git config user.name "ai-autofix[bot]"
          git config user.email "ai-autofix@users.noreply.github.com"
          FIX_BRANCH="autofix/pr-${{ github.event.pull_request.number }}"
          git checkout -b "$FIX_BRANCH"
          echo "FIX_BRANCH=$FIX_BRANCH" >> "$GITHUB_ENV"
          echo "FEATURE_BRANCH=${{ github.event.pull_request.head.ref }}" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Fix-verify loop
        run: |
          set -e
          BASE_REF="${{ github.event.pull_request.base.ref }}"
          git fetch origin "$BASE_REF"
          CHANGED=$(git diff --name-only "origin/$BASE_REF"...HEAD | grep -E '\.(ts|tsx|js|jsx)$' || true)
          if [ -z "$CHANGED" ]; then echo "No JS/TS files changed. Nothing to do."; exit 0; fi
          echo "Files in scope:"; echo "$CHANGED"

          # First pass: fix real bugs, security, async, null-safety, logic errors.
          aider --model "$MODEL" --yes-always --no-check-update \
            --message "Review these changed files and fix bugs, security issues (e.g. logging OTPs/secrets to console), missing await on async calls, null-safety problems, loose equality (==), and logic errors such as infinite loops. Keep changes minimal and behaviour-preserving." \
            $CHANGED

          # Verify-and-repair loop: keep tsc + eslint green, capped at MAX_ITERS.
          for i in $(seq 1 "$MAX_ITERS"); do
            echo "== Verify pass $i of $MAX_ITERS =="
            TSC_OK=0; LINT_OK=0
            npx tsc --noEmit 2> tsc.log && TSC_OK=1 || true
            npx eslint $CHANGED 2> eslint.log && LINT_OK=1 || true
            if [ "$TSC_OK" = "1" ] && [ "$LINT_OK" = "1" ]; then
              echo "Type check + lint clean. Exiting loop."
              break
            fi
            echo "Errors remain. Feeding them back to Aider."
            aider --model "$MODEL" --yes-always --no-check-update \
              --message "Fix ONLY these TypeScript and ESLint errors without changing behaviour: $(cat tsc.log eslint.log)" \
              $CHANGED
          done

      - name: Open sub-PR if there are fixes
        run: |
          if git diff --quiet "$BASE_SHA" HEAD; then
            echo "No fixes were made. Not opening a PR."
            exit 0
          fi
          git push origin "$FIX_BRANCH"
          gh pr create \
            --base "$FEATURE_BRANCH" \
            --head "$FIX_BRANCH" \
            --title "AI auto-fix for PR #${{ github.event.pull_request.number }}" \
            --body "Automated fixes for #${{ github.event.pull_request.number }} — ${{ github.event.pull_request.html_url }}. Review this alongside the original PR before merging into \`$FEATURE_BRANCH\`." \
            --reviewer "$TEAM_LEAD"
